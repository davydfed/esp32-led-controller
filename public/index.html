<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ESP32 LED Control React</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    .switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 1em auto;
      width: 200px;
    }
    label {
      font-weight: bold;
    }
    input[type="checkbox"] {
      transform: scale(1.5);
    }
    #status-message {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 16px;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #status-message.visible {
      opacity: 0.9;
      visibility: visible;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="status-message"></div>

  <!-- React and ReactDOM from CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <script>
    const { useState, useEffect } = React;

    function App() {
      const [ledStates, setLedStates] = useState({ led1: false, led2: false, led3: false });
      const [message, setMessage] = useState('');
      const [messageVisible, setMessageVisible] = useState(false);
      let msgTimeout = null;

      // Функція для показу повідомлення
      function showMessage(text, isError = false) {
        setMessage(text);
        const statusDiv = document.getElementById('status-message');
        statusDiv.style.backgroundColor = isError ? 'red' : '#4CAF50';
        setMessageVisible(true);

        if (msgTimeout) clearTimeout(msgTimeout);
        msgTimeout = setTimeout(() => {
          setMessageVisible(false);
        }, 3000);
      }

      // Завантаження стану з сервера
      async function fetchLedStates() {
        try {
          const res = await fetch('commands.json', { cache: "no-store" });
          if (!res.ok) throw new Error('Failed to fetch');
          const data = await res.json();
          setLedStates({
            led1: data.led1 === 'on',
            led2: data.led2 === 'on',
            led3: data.led3 === 'on',
          });
        } catch (err) {
          console.error(err);
          showMessage('Помилка завантаження стану', true);
        }
      }

      // Оновлення стану світлодіода на сервері
      async function updateLed(led, state) {
        try {
          const res = await fetch('/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ led, state: state ? 'on' : 'off' }),
          });
          if (res.ok) {
            showMessage(`Світлодіод ${led.replace('led', '')} ${state ? 'увімкнений' : 'вимкнений'}`);
            // Локально оновлюємо стан (вже має бути оновлено, але на всяк випадок)
            setLedStates(prev => ({ ...prev, [led]: state }));
          } else {
            showMessage('Помилка оновлення', true);
          }
        } catch (err) {
          console.error(err);
          showMessage('Помилка зв’язку', true);
        }
      }

      // Обробник зміни чекбокса
      function handleToggle(e) {
        const led = e.target.id;
        const newState = e.target.checked;
        updateLed(led, newState);
      }

      useEffect(() => {
        fetchLedStates();

        const interval = setInterval(fetchLedStates, 5000);

        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        const statusDiv = document.getElementById('status-message');
        if (messageVisible) {
          statusDiv.classList.add('visible');
        } else {
          statusDiv.classList.remove('visible');
        }
      }, [messageVisible]);

      return (
        React.createElement('div', null,
          React.createElement('h1', null, 'LED Controller'),
          ['led1', 'led2', 'led3'].map(led =>
            React.createElement('div', { key: led, className: 'switch' },
              React.createElement('label', { htmlFor: led }, `LED ${led.replace('led', '')}`),
              React.createElement('input', {
                type: 'checkbox',
                id: led,
                checked: ledStates[led],
                onChange: handleToggle
              })
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
