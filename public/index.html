<!DOCTYPE html>

  <title>ESP32 LED Control</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <!-- Затемнення -->
  <div class="overlay hidden" id="overlay"></div>

  <!-- Бургер-меню -->
  <div class="burger" id="burger">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- Бокове меню -->
  <nav class="sidebar hidden" id="sidebar">
    <ul>
      <li><a href="#">Головна</a></li>
      <li><a href="#faq">FAQ</a></li>
    </ul>
  </nav>

  <!-- Повідомлення та кнопка оновлення -->
  <button id="refresh-btn" class="mobile-only">Оновити</button>
  <div id="status-message"></div>

  <!-- Основна секція -->
  <h1>Керування LED</h1>
  <div id="root"></div>

  <!-- Кнопки керування конфігурацією -->
  <div class="add-led-section">
    <button id="add-led-btn">Додати світлодіод</button>
    <button id="save-config-btn">Зберегти конфігурацію</button>
  </div>
