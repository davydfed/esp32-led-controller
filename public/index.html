<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ESP32 LED Control</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <!-- Контейнер зі списком LED-карток -->
    <div id="led-container"></div>
    <!-- Кнопка для відкриття модального вікна додавання нового LED -->
    <button id="add-button" class="add-button">Додати LED</button>

    <!-- Модальне вікно з інформацією про LED -->
    <div id="info-modal" class="modal">
      <div class="modal-content">
        <h3 id="modal-title">LED Деталі</h3>
        <p>
          <strong>Тип:</strong> <span id="modal-type"></span>
        </p>
        <p>
          <strong>Стан:</strong> <span id="modal-state"></span>
        </p>
        <p>
          <strong>Ніжка ESP32:</strong> <span id="modal-pin"></span>
        </p>
        <div class="button-container">
          <button id="edit-button">Редагувати</button>
          <button id="delete-button" class="btn-danger">Видалити</button>
          <button id="close-info-modal" class="btn-cancel">Закрити</button>
        </div>
      </div>
    </div>

    <!-- Модальне вікно для редагування LED -->
    <div id="edit-modal" class="modal">
      <div class="modal-content">
        <h3>Редагувати LED</h3>
        <form id="edit-form">
          <div class="form-row">
            <label for="edit-key">Назва (ключ):</label>
            <input type="text" id="edit-key" disabled />
          </div>
          <div class="form-row">
            <label for="edit-type">Тип:</label>
            <select id="edit-type">
              <option value="regular">Regular (перемикач)</option>
              <option value="pwa">PWA (повзунок)</option>
            </select>
          </div>
          <div class="form-row" id="edit-state-container">
            <!-- Динамічно створюється поле для введення стаді (checkbox або number) -->
          </div>
          <div class="form-row">
            <label for="edit-pin">Ніжка ESP32 (GPIO):</label>
            <input type="number" id="edit-pin" required />
          </div>
          <div class="button-container">
            <button type="submit">Зберегти зміни</button>
            <button type="button" id="close-edit-modal" class="btn-cancel">
              Скасувати
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Модальне вікно для додавання нового LED -->
    <div id="add-modal" class="modal">
      <div class="modal-content">
        <h3>Додати LED</h3>
        <form id="add-form">
          <div class="form-row">
            <label for="add-key">Назва (ключ):</label>
            <input type="text" id="add-key" placeholder="led3" required />
          </div>
          <div class="form-row">
            <label for="add-type">Тип:</label>
            <select id="add-type">
              <option value="regular">Regular (перемикач)</option>
              <option value="pwa">PWA (повзунок)</option>
            </select>
          </div>
          <div class="form-row">
            <label for="add-pin">Ніжка ESP32 (GPIO):</label>
            <input type="number" id="add-pin" placeholder="2" required />
          </div>
          <div class="button-container">
            <button type="submit">Зберегти</button>
            <button type="button" id="close-add-modal" class="btn-cancel">
              Скасувати
            </button>
          </div>
        </form>
      </div>
    </div>


  <script src="script.js"></script>
</body>
</html>
