<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ESP32 LED Control</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="/manifest.json">
</head>
<body>
 <div id="led-container"></div>
    <button id="add-button">Додати</button>

    <!-- Модальне вікно для додавання нового елементу -->
    <div id="add-modal">
      <div class="modal-content">
        <h3>Додати новий елемент</h3>
        <form id="add-form">
          <div>
            <label for="led-name">Назва:</label>
            <input type="text" id="led-name" placeholder="led3" required />
          </div>
          <div>
            <label for="led-type">Тип:</label>
            <select id="led-type">
              <option value="regular">Regular (перемикач)</option>
              <option value="pwa">PWA (повзунок)</option>
            </select>
          </div>
          <div>
            <label for="led-type">Тип:</label>
            <select id="led-type">
              <option value="gpio1">GPIO1</option>
              <option value="gpio2">GPIO2</option>
            </select>
          </div>
          <button type="submit">Зберегти</button>
          <button type="button" id="close-modal">Скасувати</button>
        </form>
      </div>
    </div>



  <script src="script.js"></script>
</body>
</html>
