<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LED Control</title>
</head>
<body>
  <h1>ESP32 LED Control</h1>

  <button onclick="update('led1', 'on')">LED 1 ON</button>
  <button onclick="update('led1', 'off')">LED 1 OFF</button>
  <br />
  <button onclick="update('led2', 'on')">LED 2 ON</button>
  <button onclick="update('led2', 'off')">LED 2 OFF</button>
  <br />
  <button onclick="update('led3', 'on')">LED 3 ON</button>
  <button onclick="update('led3', 'off')">LED 3 OFF</button>

  <script>
    async function update(led, state) {
      const body = { [led]: state };
      const res = await fetch("https://esp32-led-controller.onrender.com//update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      alert(JSON.stringify(data));
    }
  </script>
</body>
</html>
