
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.json" />
  <title>ESP32 LED Control</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    .switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 1em auto;
      width: 200px;
    }
    label {
      font-weight: bold;
    }
    input[type="checkbox"] {
      transform: scale(1.5);
    }
    #status-message {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  background-color: #4CAF50;
  color: white;
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 16px;
  z-index: 1000;
  opacity: 0.9;
  transition: opacity 0.3s;
}

.hidden {
  display: none;
}

  </style>
</head>
<body>
  <h1>LED Controller</h1>
  <div class="switch"><label for="led1">LED 1</label><input type="checkbox" id="led1" /></div>
  <div class="switch"><label for="led2">LED 2</label><input type="checkbox" id="led2" /></div>
  <div class="switch"><label for="led3">LED 3</label><input type="checkbox" id="led3" /></div>

  <div id="status-message" class="hidden"></div>
  <script>
   <script>
  async function updateLED(led, state) {
    try {
      const response = await fetch('/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ led, state })
      });

      if (response.ok) {
        showMessage(`Світлодіод ${led.replace('led', '')} ${state === 'on' ? 'увімкнений' : 'вимкнений'}`);
      } else {
        showMessage('Помилка при оновленні', true);
      }
    } catch (error) {
      console.error(error);
      showMessage('Помилка з’єднання', true);
    }
  }

  document.querySelectorAll('input[type="checkbox"]').forEach(input => {
    input.addEventListener('change', () => {
      updateLED(input.id, input.checked ? "on" : "off");
    });
  });

  function showMessage(message, isError = false) {
    let msgBox = document.getElementById('status-message');
    if (!msgBox) {
      msgBox = document.createElement('div');
      msgBox.id = 'status-message';
      msgBox.style.position = 'fixed';
      msgBox.style.bottom = '20px';
      msgBox.style.left = '50%';
      msgBox.style.transform = 'translateX(-50%)';
      msgBox.style.padding = '10px 20px';
      msgBox.style.color = 'white';
      msgBox.style.borderRadius = '8px';
      msgBox.style.zIndex = '9999';
      msgBox.style.fontFamily = 'sans-serif';
      msgBox.style.fontSize = '16px';
      document.body.appendChild(msgBox);
    }

    msgBox.textContent = message;
    msgBox.style.backgroundColor = isError ? 'red' : 'green';
    msgBox.style.display = 'block';

    clearTimeout(window._msgTimeout);
    window._msgTimeout = setTimeout(() => {
      msgBox.style.display = 'none';
    }, 3000);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

  </script>
</body>
</html>
