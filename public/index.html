<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.json" />
  <title>ESP32 LED Control</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    .switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 1em auto;
      width: 200px;
    }
    label {
      font-weight: bold;
    }
    input[type="checkbox"] {
      transform: scale(1.5);
    }
    #status-message {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 16px;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #status-message.visible {
      opacity: 0.9;
      visibility: visible;
    }
  </style>
</head>
<body>
  <h1>LED Controller</h1>
  <div class="switch"><label for="led1">LED 1</label><input type="checkbox" id="led1" /></div>
  <div class="switch"><label for="led2">LED 2</label><input type="checkbox" id="led2" /></div>
  <div class="switch"><label for="led3">LED 3</label><input type="checkbox" id="led3" /></div>

  <div id="status-message"></div>

  <script>
    async function updateLED(led, state) {
      try {
        const response = await fetch('/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ led, state })
        });

        if (response.ok) {
          showMessage(`Світлодіод ${led.replace('led', '')} ${state === 'on' ? 'увімкнений' : 'вимкнений'}`);
        } else {
          showMessage('Помилка при оновленні', true);
        }
      } catch (error) {
        console.error(error);
        showMessage('Помилка з’єднання', true);
      }
    }

    function showMessage(message, isError = false) {
      const msgBox = document.getElementById('status-message');
      msgBox.textContent = message;
      msgBox.style.backgroundColor = isError ? 'red' : 'green';
      msgBox.classList.add('visible');

      if (window._msgTimeout) {
        clearTimeout(window._msgTimeout);
      }

      window._msgTimeout = setTimeout(() => {
        msgBox.classList.remove('visible');
      }, 3000);
    }

    async function syncCheckboxes() {
      try {
        const response = await fetch('commands.json', { cache: "no-store" });
        if (!response.ok) throw new Error('Failed to fetch');
        const data = await response.json();

        for (const led in data) {
          const checkbox = document.getElementById(led);
          if (checkbox) {
            const shouldBeChecked = data[led] === "on";
            if (checkbox.checked !== shouldBeChecked) {
              checkbox.checked = shouldBeChecked;
            }
          }
        }
      } catch (error) {
        console.error('Помилка при синхронізації:', error);
      }
    }

    document.querySelectorAll('input[type="checkbox"]').forEach(input => {
      input.addEventListener('change', () => {
        updateLED(input.id, input.checked ? "on" : "off");
      });
    });

    window.addEventListener('DOMContentLoaded', () => {
      syncCheckboxes();
      setInterval(syncCheckboxes, 5000);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
